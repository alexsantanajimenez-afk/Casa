name: sobremesa
description: "SOBREMESA, el juego de después de comer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/sonidos/
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf

# Icono de la app: se genera con `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/marca/icono.png"
  adaptive_icon_background: "assets/marca/icono_fondo.png"
  adaptive_icon_foreground: "assets/marca/icono_frente.png"
  web:
    generate: true
    image_path: "assets/marca/icono.png"
    background_color: "#FF4A22"
    theme_color: "#FF2E3A"

# Pantalla de arranque: se genera con `dart run flutter_native_splash:create`
flutter_native_splash:
  background_image: "assets/marca/arranque_fondo.png"
  image: "assets/marca/arranque_cafetera.png"
  branding: "assets/marca/arranque_marca.png"
  branding_mode: bottom
  android_12:
    image: "assets/marca/arranque_android12.png"
    color: "#FF4A22"
    branding: "assets/marca/arranque_marca.png"
  web: true
