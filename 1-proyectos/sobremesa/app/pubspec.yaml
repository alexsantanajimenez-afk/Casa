name: sobremesa
description: "SOBREMESA, el juego de después de comer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sonidos/
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
